<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Source for assets/share.png (the link-preview image). Shapes and text only, no photos.
       To change it: edit the text below, then follow README › "Changing the share image". -->
  <rect width="1200" height="630" fill="#fbf6ee"/>
  <circle cx="1130" cy="40" r="170" fill="#e1f0ec"/>
  <circle cx="60" cy="640" r="120" fill="#fbe7dc"/>

  <!-- brand -->
  <rect x="80" y="74" width="72" height="72" rx="20" fill="#1f6f62"/>
  <text x="116" y="124" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="700" fill="#fbf6ee">N</text>
  <circle cx="148" cy="142" r="12" fill="#e8956b" stroke="#fbf6ee" stroke-width="4"/>
  <text x="176" y="106" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#1e2a2c">Nice to Know</text>
  <text x="176" y="140" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#55625f">@missniceph</text>

  <!-- headline -->
  <text font-family="Georgia, 'Times New Roman', serif" font-size="62" font-weight="700" fill="#1e2a2c">
    <tspan x="80" y="262">Answer a few</tspan>
    <tspan x="80" y="336">questions. Get your</tspan>
    <tspan x="80" y="410" fill="#1f6f62">own checklist.</tspan>
  </text>
  <text x="80" y="478" font-family="Helvetica, Arial, sans-serif" font-size="27" fill="#55625f">Free interactive explainers · Answers stay private</text>

  <!-- pill -->
  <rect x="80" y="518" width="300" height="56" rx="28" fill="#1f6f62"/>
  <text x="230" y="555" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#ffffff">Try the checker →</text>

  <!-- checklist card -->
  <g transform="translate(760 170) rotate(2)">
    <rect x="0" y="0" width="360" height="380" rx="28" fill="#ffffff" stroke="#e5dacb" stroke-width="2"/>
    <rect x="32" y="36" width="296" height="12" rx="6" fill="#f4ece0"/>
    <rect x="32" y="36" width="190" height="12" rx="6" fill="#1f6f62"/>
    <g font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1e2a2c">
      <rect x="32" y="84" width="296" height="64" rx="14" fill="#f4ece0"/>
      <rect x="50" y="102" width="28" height="28" rx="7" fill="#1f6f62"/>
      <path d="M57 116 l6 6 l10 -12" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="96" y="110" width="170" height="12" rx="6" fill="#c9bdac"/>
      <rect x="32" y="164" width="296" height="64" rx="14" fill="#f4ece0"/>
      <rect x="50" y="182" width="28" height="28" rx="7" fill="#1f6f62"/>
      <path d="M57 196 l6 6 l10 -12" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="96" y="190" width="200" height="12" rx="6" fill="#c9bdac"/>
      <rect x="32" y="244" width="296" height="64" rx="14" fill="#f4ece0"/>
      <rect x="50" y="262" width="28" height="28" rx="7" fill="#fff" stroke="#857a6c" stroke-width="2.5"/>
      <rect x="96" y="270" width="140" height="12" rx="6" fill="#c9bdac"/>
    </g>
    <rect x="32" y="326" width="120" height="30" rx="15" fill="#fbe7dc"/>
    <text x="92" y="347" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#9c4a26">12 days left</text>
  </g>
</svg>
